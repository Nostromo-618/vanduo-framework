name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: false

      - name: Run CSS linting
        run: pnpm run lint:css

      - name: Run JS linting
        run: pnpm run lint:js

      - name: Build production assets
        run: pnpm run build

      - name: Validate version consistency
        run: pnpm run check:versions

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/build-info.json || exit 1
          test -f dist/vanduo.css || exit 1
          test -f dist/vanduo.min.css || exit 1
          test -f dist/vanduo.js || exit 1
          test -f dist/vanduo.min.js || exit 1
          test -f dist/vanduo.esm.js || exit 1
          test -f dist/vanduo.esm.min.js || exit 1
          test -f dist/vanduo.cjs.js || exit 1
          test -f dist/vanduo.cjs.min.js || exit 1
          echo "✅ Build artifacts verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7
