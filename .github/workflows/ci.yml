name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "vanduo-oss-animated.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "vanduo-oss-animated.svg"

# Least-privilege default token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: false

      - name: Run CSS linting
        run: pnpm run lint:css

      - name: Run JS linting
        run: pnpm run lint:js

      - name: Build production assets
        run: pnpm run build

      - name: Validate version consistency
        run: pnpm run check:versions

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/build-info.json || exit 1
          test -f dist/vanduo.css || exit 1
          test -f dist/vanduo.min.css || exit 1
          test -f dist/vanduo.js || exit 1
          test -f dist/vanduo.min.js || exit 1
          test -f dist/vanduo.esm.js || exit 1
          test -f dist/vanduo.esm.min.js || exit 1
          test -f dist/vanduo.cjs.js || exit 1
          test -f dist/vanduo.cjs.min.js || exit 1
          echo "✅ Build artifacts verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
