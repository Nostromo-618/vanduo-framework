schema: spec-driven

context: |
  Package: @vanduo-oss/framework (MIT, vanduo-oss org). Current release: 1.4.5.
  Stack: Vanilla JavaScript (zero runtime dependencies), CSS with --vd-* design tokens.
  Build: esbuild + lightningcss → dist/ (IIFE, ESM, CJS, minified CSS).
  Tests: Playwright component tests in tests/; fixture server; tagged @a11y, @e2e, @perf.
  Components register via Vanduo.register(); init via Vanduo.init(root).
  Theme Switcher: js/components/theme-switcher.js; persistence key vanduo-theme-preference.
  Do not publish openspec/ to npm (files field is dist/, css/, js/, fonts/, icons/).

rules:
  proposal:
    - Call out semver impact and backward compatibility for data-toggle="theme" consumers
    - Note if Playwright fixtures/tests must change
  specs:
    - Use Given/When/Then scenario format under each requirement
    - Reference tests/components/theme-switcher.spec.ts when applicable
    - Use SHALL/MUST for normative requirements
  design:
    - Prefer extending existing components over new abstractions
    - No new runtime npm dependencies
  tasks:
    - Include pnpm build:min and pnpm test when code changes
    - Include docs sync step when public API or CSS changes
  changelog:
    - Track Framework and Ecosystem only; never add a Docs product column
    - Framework-only releases use a single Framework section (no empty Ecosystem column)
    - See openspec/specs/changelog/spec.md
