# pnpm settings live here (pnpm 10+ no longer reads the package.json "pnpm" field).
onlyBuiltDependencies:
  - esbuild
  - "@playwright/test"

overrides:
  # brace-expansion raised from 5.0.6 at retirement: <=5.0.7 is itself the
  # advisory subject (GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg).
  brace-expansion: ">=5.0.8"
  picomatch: "2.3.2"
  "flatted@<=3.4.1": ">=3.4.2"
  # Added at retirement so the final CI run and archived state are clean. These
  # affect this repo's own install only — pnpm overrides do not propagate to
  # consumers of the published package.
  postcss: ">=8.5.18"
  fast-uri: ">=3.1.4"

