<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Utilities Test Fixture</title>
    <link rel="stylesheet" href="../../css/vanduo.css">
</head>
<body>
    <!-- Background color test elements -->
    <div id="bg-red-5" class="vd-bg-red-5">Red 5 background</div>
    <div id="bg-blue-3" class="vd-bg-blue-3">Blue 3 background</div>
    <div id="bg-teal-7" class="vd-bg-teal-7">Teal 7 background</div>
    <div id="bg-orange-0" class="vd-bg-orange-0">Orange 0 background</div>
    <div id="bg-gray-9" class="vd-bg-gray-9">Gray 9 background</div>
    <div id="bg-indigo-4" class="vd-bg-indigo-4">Indigo 4 background</div>
    <div id="bg-violet-6" class="vd-bg-violet-6">Violet 6 background</div>
    <div id="bg-pink-2" class="vd-bg-pink-2">Pink 2 background</div>

    <!-- Text color test elements -->
    <div id="text-red-7" class="vd-text-red-7">Red 7 text</div>
    <div id="text-green-5" class="vd-text-green-5">Green 5 text</div>
    <div id="text-cyan-8" class="vd-text-cyan-8">Cyan 8 text</div>
    <div id="text-grape-4" class="vd-text-grape-4">Grape 4 text</div>
    <div id="text-yellow-6" class="vd-text-yellow-6">Yellow 6 text</div>
    <div id="text-lime-3" class="vd-text-lime-3">Lime 3 text</div>

    <!-- Combined bg + text test element -->
    <div id="combined" class="vd-bg-teal-2 vd-text-indigo-9">Combined bg and text</div>

    <!-- Regression: existing semantic utilities must still work -->
    <div id="semantic-bg" class="vd-bg-primary">Semantic bg-primary</div>
    <div id="semantic-text" class="vd-text-error">Semantic text-error</div>
</body>
</html>
