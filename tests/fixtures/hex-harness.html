<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vd-hex Test Fixture</title>
  <link rel="stylesheet" href="/css/vanduo.css">
  <style>
    :root {
      --vd-bg-primary: #ffffff;
      --vd-bg-secondary: #f5f5f5;
      --vd-border-color: #e0e0e0;
      --vd-color-primary: #3b82f6;
      --vd-text-primary: #1f2937;
      --vd-text-muted: #6b7280;
    }
    #mount {
      width: 960px;
      height: 640px;
    }
    canvas {
      width: 960px;
      height: 640px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="mount">
    <canvas id="hex-canvas"></canvas>
  </div>

  <script type="module">
    import { VdHexGrid } from '/js/components/vd-hex.js';
    import * as hexMath from '/js/utils/hex-math.js';

    window.hexMath = hexMath;
    window.lastEvent = null;

    window.createGrid = (options = {}) => {
      const element = document.getElementById('mount');
      const canvas = document.getElementById('hex-canvas');
      const grid = new VdHexGrid({
        element,
        canvas,
        size: 30,
        width: 10,
        height: 10,
        rotation: 0,
        ...options,
      });

      grid.on('select', (data) => {
        window.lastEvent = { type: 'select', data };
      });
      grid.on('zoom', (data) => {
        window.lastEvent = { type: 'zoom', data };
      });
      grid.on('pan', (data) => {
        window.lastEvent = { type: 'pan', data };
      });

      window.grid = grid;
      return grid;
    };

    window.resetGrid = (options = {}) => {
      return window.createGrid(options);
    };
  </script>
</body>
</html>
