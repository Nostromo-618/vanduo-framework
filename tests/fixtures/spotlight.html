<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Test Fixture</title>
  <link rel="stylesheet" href="/css/vanduo.css">
  <link rel="stylesheet" href="/css/components/spotlight.css">
  <style>
    .box { display:inline-block; padding:1rem 2rem; margin:2rem; background:#0d6efd; color:#fff; border-radius:0.5rem; }
  </style>
</head>
<body style="padding:2rem;">
  <div id="target-1" class="box">Feature One</div>
  <div id="target-2" class="box">Feature Two</div>
  <div id="target-3" class="box">Feature Three</div>

  <button id="start-tour" onclick="startTour()">Start Tour</button>

  <script src="/js/utils/helpers.js"></script>
  <script src="/js/vanduo.js"></script>
  <script src="/js/components/spotlight.js"></script>
  <script>
    Vanduo.init();
    function startTour() {
      VanduoSpotlight.start([
        { target: '#target-1', title: 'Step 1', description: 'This is the first feature.' },
        { target: '#target-2', title: 'Step 2', description: 'This is the second feature.' },
        { target: '#target-3', title: 'Step 3', description: 'This is the third feature.' }
      ]);
    }
  </script>
</body>
</html>
