    <!-- Animation only; the wordmark is embedded as vector outlines below, so no
         external font is needed (GitHub blocks external font loads in SVGs). -->
    <style>
      .bot-container {
        animation: levitate 4s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes levitate {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      /* Transparent background: the wordmark adapts to the viewer's theme so it
         reads well on both light and dark. The inline fill on the path is a
         brand-blue fallback for renderers that ignore CSS or media queries. */
      @media (prefers-color-scheme: light) { .wordmark { fill: #1f2328; } }
      @media (prefers-color-scheme: dark)  { .wordmark { fill: #f8fafc; } }
    </style>

